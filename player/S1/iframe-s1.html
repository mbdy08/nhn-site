    <!-- 🛡️ حماية ضد الـ Sandbox وإيقاف البث إذا تم حظر الإعلانات -->
    <script>
        try {
            if (window.document.domain === "") {
                document.documentElement.innerHTML = "<body style='background:#000; color:#ff3333; display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; font-family:Arial;'><h2>⚠️ تم إيقاف البث</h2><p>الموقع المستضيف يمنع ظهور الإعلانات.</p></body>";
                throw new Error("Sandbox Detected");
            }
        } catch (e) {
            document.documentElement.innerHTML = "<body style='background:#000; color:#ff3333; display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; font-family:Arial;'><h2>⚠️ تم إيقاف البث</h2><p>الموقع المستضيف يمنع ظهور الإعلانات.</p></body>";
            throw new Error("Sandbox Detected");
        }
    </script>

    <!-- 🛡️ حماية ضد الكليك يمين واختصارات لوحة المفاتيح -->
    <script>
        window.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        }, false);

        window.addEventListener('keydown', function(e) {
            if (e.keyCode === 123 || 
               (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || 
               (e.ctrlKey && e.keyCode === 85)) {
                e.preventDefault();
                return false;
            }
        }, false);
    </script>

    <!-- 🟢 مكتبة HLS و Plyr الرسمية -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            user-select: none;
            -webkit-user-select: none;
        }
        body, html { 
            width: 100%; 
            height: 100%; 
            background-color: #000; 
            overflow: hidden; 
        }

        .video-wrapper { 
            position: relative; 
            width: 100%; 
            height: 100%; 
            background-color: #000; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .plyr {
            width: 100% !important;
            height: 100% !important;
            position: relative !important;
        }

        .plyr__video-wrapper {
            width: 100% !important;
            height: 100% !important;
            padding-bottom: 0 !important;
        }

        video { 
            width: 100% !important; 
            height: 100% !important; 
            outline: none; 
            object-fit: contain !important;
        }

        :root { 
            --plyr-color-main: #e50914; 
            --plyr-video-background: #000; 
        }

        video::-webkit-media-controls-enclosure { 
            display: none !important; 
        }

        /* إخفاء شريط التقديم والوقت لتناسب البث المباشر */
        div.plyr__controls input[data-plyr="seek"], 
        div.plyr__progress, 
        div.plyr__time, 
        .plyr__time--current, 
        .plyr__time--duration {
            display: none !important; 
            visibility: hidden !important; 
            opacity: 0 !important; 
            width: 0 !important; 
            height: 0 !important; 
            pointer-events: none !important;
        }
    </style>
</head>
<body>

    <div class="video-wrapper">
        <video id="video-player" playsinline webkit-playsinline></video>
    </div>

    <!-- 📡 مشغل البث (HLS.js + Plyr) بنفس التصميم الأصلي -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || 'ar';

        // 🟢 روابط البث المباشر الخاصة بك
        const streams = {
            ar: "https://ouou1.b-cdn.net/live/ch10_hd/index.m3u8",
            en: "https://ouou1.b-cdn.net/live/ch10_hd/index.m3u8"
        };

        const streamUrl = streams[lang] || streams.ar;
        const videoElement = document.getElementById('video-player');

        let hlsInstance = null;

        // بناء المشغل مع تعطيل تخزين حالة الكتم السابقة لضمان عمل الصوت دائماً
        const player = new Plyr(videoElement, {
            controls: ['play-large', 'play', 'mute', 'volume', 'settings', 'fullscreen'],
            settings: ['quality'],
            storage: { enabled: false },
            quality: {
                default: 0,
                options: [720, 480, 0],
                forced: true,
                onChange: (newQuality) => {
                    if (!hlsInstance) return;
                    if (newQuality === 0) {
                        hlsInstance.currentLevel = -1;
                    } else {
                        hlsInstance.levels.forEach((level, index) => {
                            if (level.height === newQuality) {
                                hlsInstance.currentLevel = index;
                            }
                        });
                    }
                }
            },
            i18n: {
                quality: 'الجودة',
                qualityLabel: {
                    0: 'تلقائي (Auto)',
                    720: '720p 60Hz',
                    480: '480p 30Hz'
                }
            },
            autoplay: false,
            muted: false,
            volume: 1,
            ratio: '16:9'
        });

        window.player = player;

        if (Hls.isSupported()) {
            hlsInstance = new Hls({
                enableWorker: true,
                lowLatencyMode: false,
                backBufferLength: 30,
                maxBufferLength: 30,
                maxMaxBufferLength: 60,
                maxBufferHole: 0.5,
                nudgeOffset: 0.2,
                nudgeMaxRetry: 5,
                manifestLoadingMaxRetry: 10,
                manifestLoadingRetryDelay: 1000,
                levelLoadingMaxRetry: 10,
                levelLoadingRetryDelay: 1000,
                fragLoadingMaxRetry: 10,
                fragLoadingRetryDelay: 1000
            });

            hlsInstance.loadSource(streamUrl);
            hlsInstance.attachMedia(videoElement);

            // مزامنة اللحظة الحية للبث فور ضغط المشاهد على زر التشغيل
            player.on('play', function () {
                if (hlsInstance && hlsInstance.liveSyncPosition) {
                    const latency = hlsInstance.liveSyncPosition - videoElement.currentTime;
                    if (latency > 25) {
                        videoElement.currentTime = hlsInstance.liveSyncPosition;
                    }
                }
            });

            hlsInstance.on(Hls.Events.LEVEL_SWITCHED, function (event, data) {
                if (hlsInstance.autoLevelEnabled) {
                    const currentLevel = hlsInstance.levels[data.level];
                    if (currentLevel) {
                        const qualityBadge = document.querySelector('.plyr__menu__container [data-plyr="quality"] span');
                        if (qualityBadge) {
                            qualityBadge.innerText = 'تلقائي (' + currentLevel.height + 'p)';
                        }
                    }
                }
            });

            hlsInstance.on(Hls.Events.ERROR, function (event, data) {
                if (data.fatal) {
                    switch (data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            hlsInstance.startLoad();
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            hlsInstance.recoverMediaError();
                            break;
                        default:
                            hlsInstance.destroy();
                            break;
                    }
                }
            });

        } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
            videoElement.src = streamUrl;
        }
    </script>
