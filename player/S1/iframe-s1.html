<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer-when-downgrade" />
    <title>Live Player - S1</title>

    <!-- 📊 كود تتبع جوجل أناليتكس -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-E7E9M7JB1Q"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-E7E9M7JB1Q');
    </script>

    <!-- 🛡️ حماية ضد الكليك يمين واختصارات لوحة المفاتيح -->
    <script>
        window.addEventListener('contextmenu', function(e) { e.preventDefault(); }, false);
        window.addEventListener('keydown', function(e) {
            if (e.keyCode === 123 || 
               (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || 
               (e.ctrlKey && e.keyCode === 85)) {
                e.preventDefault();
                return false;
            }
        }, false);
    </script>

    <!-- 🟢 مكتبة HLS و Plyr الرسمية -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            user-select: none;
            -webkit-user-select: none;
        }
        body, html { 
            width: 100%; 
            height: 100%; 
            background-color: #000; 
            overflow: hidden; 
        }

        .video-wrapper { 
            position: relative; 
            width: 100%; 
            height: 100%; 
            background-color: #000; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .plyr {
            width: 100% !important;
            height: 100% !important;
            position: relative !important;
        }

        .plyr__video-wrapper {
            width: 100% !important;
            height: 100% !important;
            padding-bottom: 0 !important;
        }

        video { 
            width: 100% !important; 
            height: 100% !important; 
            outline: none; 
            object-fit: contain !important;
        }

        :root { 
            --plyr-color-main: #00ff88; 
            --plyr-video-background: #000; 
        }

        /* إخفاء أشرطة الوقت ليتناسب مع البث المباشر */
        div.plyr__controls input[data-plyr="seek"], 
        div.plyr__progress, 
        div.plyr__time, 
        .plyr__time--current, 
        .plyr__time--duration {
            display: none !important; 
            visibility: hidden !important; 
            opacity: 0 !important; 
            width: 0 !important; 
            height: 0 !important; 
            pointer-events: none !important;
        }
    </style>
</head>
<body>

    <div class="video-wrapper">
        <video id="video-player" playsinline webkit-playsinline></video>
    </div>

    <script>
        // ========================================================
        // 💥 ضع رابط البث المباشر هنا مباشرة كما كنت تفعل 💥
        // مثال: "https://uouo2.b-cdn.net/live/ch10_hd/index.m3u8"
        // ========================================================
        const streamUrl = "https://uouo1.b-cdn.net/live/ch10_hd/index.m3u8";

        const videoElement = document.getElementById('video-player');
        let hlsInstance = null;

        // تهيئة مشغل Plyr بشكل سليم دون إجبار جودات وهمية تسبب تعليق الشاشة
        const player = new Plyr(videoElement, {
            controls: ['play-large', 'play', 'mute', 'volume', 'fullscreen'],
            autoplay: true,
            muted: false,
            ratio: '16:9'
        });
        window.player = player;

        if (Hls.isSupported()) {
            hlsInstance = new Hls({
                enableWorker: true,
                lowLatencyMode: false,          // إيقاف الوضع فائق السرعة لمنع إعادة اللقطات
                liveSyncDurationCount: 3,       // تخزين 3 مقاطع للأمام لمنع التقطيع
                liveMaxLatencyDurationCount: 5,
                manifestLoadingMaxRetry: 6,
                levelLoadingMaxRetry: 6
            });

            hlsInstance.loadSource(streamUrl);
            hlsInstance.attachMedia(videoElement);

            hlsInstance.on(Hls.Events.MANIFEST_PARSED, function () {
                videoElement.play().catch(function() {
                    // إذا منع المتصفح تشغيل الصوت تلقائياً، يبدأ صامتاً ليعمل البث فوراً
                    videoElement.muted = true;
                    videoElement.play();
                });
            });

            hlsInstance.on(Hls.Events.ERROR, function (event, data) {
                if (data.fatal) {
                    switch (data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            hlsInstance.startLoad();
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            hlsInstance.recoverMediaError();
                            break;
                        default:
                            hlsInstance.destroy();
                            break;
                    }
                }
            });

        } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
            videoElement.src = streamUrl;
        }
    </script>

</body>
</html>
