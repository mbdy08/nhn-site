    <!-- 📡 مشغل البث (HLS.js + Plyr) مع الإظهار الإجباري لزر الجودة وتحديد الجودات -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || 'ar';

        const streams = {
            ar: "https://yoy1.b-cdn.net/S1/ar/master.m3u8",
            en: "https://yoy1.b-cdn.net/S1/en/master.m3u8"
        };

        const streamUrl = streams[lang] || streams.ar;
        const videoElement = document.getElementById('video-player');

        function attachAdInsidePlyr() {
            const plyrContainer = document.querySelector('.plyr');
            const adBox = document.getElementById('custom-ad-box');
            if (plyrContainer && adBox && adBox.parentElement !== plyrContainer) {
                plyrContainer.appendChild(adBox);
            }
        }

        let hlsInstance = null;

        // بناء المشغل فوراً وتثبيت إعدادات الجودة وإلغاء خيار السرعة
        const player = new Plyr(videoElement, {
            controls: ['play-large', 'play', 'mute', 'volume', 'settings', 'fullscreen'],
            settings: ['quality'],
            quality: {
                default: 0,
                options: [720, 480, 0],
                forced: true,
                onChange: (newQuality) => {
                    if (!hlsInstance) return;
                    if (newQuality === 0) {
                        hlsInstance.currentLevel = -1; // وضع تلقائي Auto
                    } else {
                        hlsInstance.levels.forEach((level, index) => {
                            if (level.height === newQuality) {
                                hlsInstance.currentLevel = index;
                            }
                        });
                    }
                }
            },
            i18n: {
                quality: 'الجودة',
                qualityLabel: {
                    0: 'تلقائي (Auto)',
                    720: '720p 60Hz',
                    480: '480p 30Hz'
                }
            },
            autoplay: false,
            muted: false,
            ratio: '16:9'
        });

        window.player = player;
        player.on('ready', attachAdInsidePlyr);
        player.on('enterfullscreen', attachAdInsidePlyr);

        if (Hls.isSupported()) {
            hlsInstance = new Hls({
                enableWorker: true,
                lowLatencyMode: false
            });

            hlsInstance.loadSource(streamUrl);
            hlsInstance.attachMedia(videoElement);

            hlsInstance.on(Hls.Events.LEVEL_SWITCHED, function (event, data) {
                // تحديث تسمية الجودة التلقائية أمام المشاهد إذا كان على وضع Auto
                if (hlsInstance.autoLevelEnabled) {
                    const currentLevel = hlsInstance.levels[data.level];
                    if (currentLevel) {
                        const qualityBadge = document.querySelector('.plyr__menu__container [data-plyr="quality"] span');
                        if (qualityBadge) {
                            qualityBadge.innerText = 'تلقائي (' + currentLevel.height + 'p)';
                        }
                    }
                }
            });

            hlsInstance.on(Hls.Events.ERROR, function (event, data) {
                if (data.fatal) {
                    switch (data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            hlsInstance.startLoad();
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            hlsInstance.recoverMediaError();
                            break;
                        default:
                            hlsInstance.destroy();
                            break;
                    }
                }
            });

        } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
            videoElement.src = streamUrl;
        }

        document.addEventListener("DOMContentLoaded", attachAdInsidePlyr);
    </script>
